<dialog id="seat-preview-dialog" class="seat-preview-dialog" aria-labelledby="seat-preview-title">
  <header class="seat-preview-heading"><div><p class="eyebrow">YOUR PLACE IN THE CROWD</p><h2 id="seat-preview-title">See My View</h2></div><button type="button" class="venue-3d-btn" data-preview-close aria-label="Close seat preview">×</button></header>
  <div class="seat-preview-body">
    <p>Illustrative view from the 3D model; actual sightlines may differ.</p>
    <div class="seat-preview-slots" role="group" aria-label="Compare seat views"><button type="button" class="venue-3d-btn" data-preview-slot="A" aria-pressed="true">Seat A</button><button type="button" class="venue-3d-btn" data-preview-slot="B" aria-pressed="false" disabled>Seat B</button></div>
    <label class="seat-preview-picker">Compare another seat<select id="seat-preview-compare"><option value="">Choose a seat to compare</option></select></label>
    <p id="seat-preview-details" role="status" aria-live="polite"></p>
    <div class="seat-preview-tools" role="group" aria-label="Seat camera controls"><button type="button" class="venue-3d-btn" data-preview-look="-1">Look left</button><button type="button" class="venue-3d-btn" data-preview-look="1">Look right</button><button type="button" class="venue-3d-btn" data-preview-reset>Reset view</button><button type="button" class="venue-3d-btn" data-preview-overview>Venue overview</button></div>
    <div id="seat-preview-stage" class="seat-preview-stage" role="img" aria-label="Approximate view from the selected seat"></div>
    <p id="seat-preview-error" role="alert" hidden></p>
    <p class="seat-preview-note">Comparing views does not select or reserve tickets. Return to the seat map to change your booking.</p>
    <button type="button" class="button button-outline" data-preview-close>Return to seat map</button>
  </div>
</dialog>
