{% macro venue_art(event, cls='') %}
<svg class="venue-sketch {{ cls }}" viewBox="0 0 360 185" fill="none" aria-hidden="true">
  <g class="sketch-guides" stroke="currentColor" stroke-width=".6" opacity=".24"><path d="M180 9v167M16 92h328" stroke-dasharray="3 5"/><path d="M20 30v-9h13m294 0h13v9M20 155v9h13m294 0h13v-9"/><circle cx="180" cy="92" r="77"/></g>
  {% if event.layout_type=='arena' %}
  <g class="sketch-structure" stroke="currentColor" stroke-width="1.1"><ellipse cx="180" cy="93" rx="125" ry="69"/><ellipse cx="180" cy="93" rx="115" ry="61"/><ellipse cx="180" cy="93" rx="103" ry="52"/><ellipse cx="180" cy="93" rx="91" ry="43"/><ellipse class="sketch-field" cx="180" cy="93" rx="74" ry="31"/><path d="M180 24v38m62-28-25 31m71-7-42 20m59 15h-51m34 35-42-20m-4 44-25-31m-37 41v-38m-62 28 25-31m-71 7 42-20m-59-15h51M72 58l42 20m4-44 25 31" opacity=".6"/><path d="M172 88l16 10m0-10-16 10M146 93h-10m88 0h-10"/></g>
  {% elif event.layout_type=='tables' %}
  <g class="sketch-structure" stroke="currentColor" stroke-width="1.05"><path d="M55 35h250v117H55zM62 42h236v103H62z"/><path d="M133 35V24h94v11M150 23v-5h60v5"/>{% for x in [89,143,197,251] %}<rect class="sketch-field" x="{{ x }}" y="62" width="20" height="66" rx="3"/>{% for y in [68,84,100,116] %}<path d="M{{ x-7 }} {{ y }}h-5v7h5M{{ x+27 }} {{ y }}h5v7h-5"/>{% endfor %}<path d="M{{ x+10 }} 75v3m0 13v3m0 13v3" stroke-width="2"/>{% endfor %}<path d="M163 152v11h34v-11"/></g>
  {% elif event.category=='Archery Contest' %}
  <g class="sketch-structure" stroke="currentColor" stroke-width="1.05"><path class="sketch-field" d="M69 48h222v77H69z"/>{% for x in [114,180,246] %}<circle cx="{{ x }}" cy="66" r="13"/><circle cx="{{ x }}" cy="66" r="7"/><circle cx="{{ x }}" cy="66" r="2"/><path d="M{{ x }} 87v26m-4-5 4 5 4-5"/>{% endfor %}<path d="M80 119h200" stroke-dasharray="4 4"/>{% for x in range(80,283,17) %}<rect x="{{ x }}" y="139" width="10" height="10" rx="1"/>{% endfor %}<path d="M74 133h213v22H74zM55 46v81m250-81v81"/></g>
  {% else %}
  <g class="sketch-structure" stroke="currentColor" stroke-width="1.05"><rect class="sketch-field" x="59" y="65" width="242" height="55" rx="2"/><path d="M71 92h218M75 70v45m210-45v45M167 88l11 4-11 4m26-8-11 4 11 4M77 34h206v22H77zM77 129h206v22H77z"/>{% for x in range(85,278,16) %}<path d="M{{ x }} 40h9v10h-9zM{{ x }} 135h9v10h-9z"/>{% endfor %}<path d="M45 58v68m270-68v68M38 64l7-9 7 9m256 56 7 9 7-9M180 34V20m-5 0h10M180 151v14m-5 0h10"/></g>
  {% endif %}
  <g stroke="currentColor" stroke-width=".8" opacity=".45"><path d="M19 171h35m-35-3v6m35-6v6m270-148 6-10 6 10m-6-10v19"/></g>
</svg>
{% endmacro %}
