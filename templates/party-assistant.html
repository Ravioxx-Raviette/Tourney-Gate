<form id="party-form" class="party-assistant">
  <h3>Seat Our Party</h3><p>Find seats together in <strong id="party-tier">the current tier</strong>. Suggestions stay on one physical bench or gallery row, or at one banquet table.</p>
  <div class="party-fields"><label>Party size<input id="party-count" type="number" min="1" max="8" step="1" value="2" required></label><label>Total budget · {{ currency }}<input id="party-budget" type="number" min="0" step="0.01" placeholder="Any budget"></label></div>
  <button id="party-find" class="button button-small" type="submit" disabled>Find seats together</button>
  <p id="party-result" role="status" aria-live="polite"></p>
  <div class="party-actions"><button id="party-use" type="button" class="button button-small" hidden>Use these seats</button><button id="party-preview" type="button" class="button button-outline button-small" hidden>Preview group in 3D</button></div>
</form>
